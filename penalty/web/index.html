<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Penalty Shootout - FIFA 2026 penalty kick game. Swipe to shoot and score!">
  <meta name="theme-color" content="#0A1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penalty Shootout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Penalty Shootout</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0A1628; overflow: hidden; font-family: sans-serif; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0A1628, #162238 30%, #1B3D2A 60%, #1B5E20);
      z-index: 9999;
      transition: opacity .6s ease-out;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .ball { font-size: 72px; animation: bounce .9s ease-in-out infinite; }
    #loading .title { margin-top: 28px; font-size: 28px; font-weight: 800; letter-spacing: 6px; background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s ease-in-out infinite; }
    #loading .sub { margin-top: 10px; font-size: 13px; letter-spacing: 5px; color: rgba(255,255,255,.35); text-transform: uppercase; }
    #loading .dots { margin-top: 40px; display: flex; gap: 10px; }
    #loading .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,215,0,.5); animation: dot-pulse 1.4s ease-in-out infinite both; }
    #loading .dot:nth-child(2) { animation-delay: .2s; }
    #loading .dot:nth-child(3) { animation-delay: .4s; }
    #loading .err { margin-top: 60px; font-size: 14px; color: rgba(255,255,255,.3); display: none; }
    #loading .err.show { display: block; }
    #loading .retry { margin-top: 16px; display: none; padding: 10px 28px; border: 1px solid rgba(255,215,0,.3); background: rgba(255,215,0,.08); color: rgba(255,215,0,.8); font-size: 13px; letter-spacing: 2px; border-radius: 24px; cursor: pointer; }
    #loading .retry.show { display: inline-block; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-24px); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
    @keyframes dot-pulse { 0%,80%,100% { transform: scale(.6); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="ball">&#x26BD;</div>
    <div class="title">PENALTY PALOOZA</div>
    <div class="sub">FIFA 2026 Edition</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="err">Could not load. Open DevTools (F12) &rarr; Console and tell me what red errors you see.</div>
    <button class="retry" onclick="location.reload()">RETRY</button>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Run AFTER the DOM is ready (script is at bottom of body)
    var el = document.getElementById('loading');
    var errEl = el.querySelector('.err');
    var retryEl = el.querySelector('.retry');

    window.addEventListener('flutter-first-frame', function() {
      el.classList.add('hide');
    });

    // If Flutter hasn't loaded in 15s, show error message
    setTimeout(function() {
      if (!el.classList.contains('hide')) {
        errEl.classList.add('show');
        retryEl.classList.add('show');
      }
    }, 15000);

    // Kill any old service workers from previous deployments
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) {
        for (var i = 0; i < r.length; i++) r[i].unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(n) {
        for (var i = 0; i < n.length; i++) {
          if (/flutter|penalty/i.test(n[i])) caches.delete(n[i]);
        }
      });
    }
  </script>
</body>
</html>
