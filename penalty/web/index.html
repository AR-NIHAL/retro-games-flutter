<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Penalty Shootout - FIFA 2026 penalty kick game. Swipe to shoot and score!">
  <meta name="theme-color" content="#0A1628">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penalty Shootout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Preload critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' ws://localhost:*">

  <title>Penalty Shootout</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0A1628;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0A1628 0%, #162238 30%, #1B3D2A 60%, #1B5E20 100%);
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading .ball {
      font-size: 72px;
      animation: bounce 0.9s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    }

    #loading .title {
      margin-top: 28px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.25));
      animation: pulse 2s ease-in-out infinite;
    }

    #loading .subtitle {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    #loading .indicator {
      margin-top: 40px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #loading .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.5);
      animation: dot-pulse 1.4s ease-in-out infinite both;
    }

    #loading .dot:nth-child(1) { animation-delay: 0s; }
    #loading .dot:nth-child(2) { animation-delay: 0.2s; }
    #loading .dot:nth-child(3) { animation-delay: 0.4s; }

    #loading .help-text {
      margin-top: 60px;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.2);
      opacity: 0;
      animation: fade-in 3s ease-out 3s forwards;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.0); opacity: 1; }
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      loading.classList.add('fade-out');
      setTimeout(function () { loading.style.display = 'none'; }, 600);
    });
  </script>
</head>
<body>
  <div id="loading">
    <div class="ball">&#x26BD;</div>
    <div class="title">PENALTY PALOOZA</div>
    <div class="subtitle">FIFA 2026 Edition</div>
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="help-text">Loading match&hellip;</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
