<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Penalty Shootout - FIFA 2026 penalty kick game. Swipe to shoot and score!">
  <meta name="theme-color" content="#0A1628">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penalty Shootout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Penalty Shootout</title>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0A1628;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0A1628 0%, #162238 30%, #1B3D2A 60%, #1B5E20 100%);
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading .ball {
      font-size: 72px;
      animation: bounce 0.9s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    }

    #loading .title {
      margin-top: 28px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.25));
      animation: pulse 2s ease-in-out infinite;
    }

    #loading .subtitle {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    #loading .indicator {
      margin-top: 40px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #loading .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.5);
      animation: dot-pulse 1.4s ease-in-out infinite both;
    }

    #loading .dot:nth-child(1) { animation-delay: 0s; }
    #loading .dot:nth-child(2) { animation-delay: 0.2s; }
    #loading .dot:nth-child(3) { animation-delay: 0.4s; }

    #loading .status {
      margin-top: 60px;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.2);
      transition: color 0.5s;
    }

    #loading .status.warn {
      color: rgba(255, 215, 0, 0.5);
    }

    #loading .retry-btn {
      margin-top: 20px;
      display: none;
      padding: 10px 28px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      background: rgba(255, 215, 0, 0.08);
      color: rgba(255, 215, 0, 0.8);
      font-size: 13px;
      letter-spacing: 2px;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    #loading .retry-btn:hover {
      background: rgba(255, 215, 0, 0.15);
    }

    #loading .retry-btn.show {
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.0); opacity: 1; }
    }
  </style>

  <script>
    // Loading screen lifecycle
    var loadingEl = document.getElementById('loading');

    function hideLoading() {
      loadingEl.classList.add('fade-out');
      setTimeout(function () { loadingEl.style.display = 'none'; }, 600);
    }

    // Hide on Flutter first frame
    window.addEventListener('flutter-first-frame', function () {
      hideLoading();
    });

    // Fallback: if still loading after 20s, show status warning + retry
    setTimeout(function () {
      if (!loadingEl.classList.contains('fade-out')) {
        document.getElementById('status-text').textContent = 'Taking longer than expected\u2026';
        document.getElementById('status-text').className = 'status warn';
        document.getElementById('retry-btn').className = 'retry-btn show';
      }
    }, 20000);

    // Retry button reloads the page
    function retryLoad() {
      window.location.reload();
    }
  </script>
</head>
<body>
  <div id="loading">
    <div class="ball">&#x26BD;</div>
    <div class="title">PENALTY PALOOZA</div>
    <div class="subtitle">FIFA 2026 Edition</div>
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="status-text" class="status">Loading match\u2026</div>
    <button id="retry-btn" class="retry-btn" onclick="retryLoad()">RETRY</button>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
