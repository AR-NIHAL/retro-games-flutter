<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Penalty Shootout - FIFA 2026 penalty kick game. Swipe to shoot and score!">
  <meta name="theme-color" content="#0A1628">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Penalty Shootout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' ws://localhost:*">

  <title>Penalty Shootout</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A1628;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0A1628 0%, #162238 35%, #1B3D2A 65%, #1B5E20 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    #loading .ball {
      font-size: 64px;
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    #loading .title {
      margin-top: 24px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      color: rgba(255, 215, 0, 0.8);
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
    }

    #loading .subtitle {
      margin-top: 8px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    #loading .bar {
      margin-top: 32px;
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading .bar-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').classList.add('hide');
    });
  </script>
</head>
<body>
  <div id="loading">
    <div class="ball">&#x26BD;</div>
    <div class="title">PENALTY PALOOZA</div>
    <div class="subtitle">Loading...</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
